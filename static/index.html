<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Room</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; justify-content: center; align-items: center; }

  /* Join Screen */
  #join-screen { text-align: center; }
  #join-screen h1 { font-size: 2rem; margin-bottom: 1.5rem; color: #fff; }
  #join-screen input { display: block; width: 280px; padding: 12px 16px; margin: 0.5rem auto; border: 1px solid #333; border-radius: 8px; background: #16213e; color: #e0e0e0; font-size: 1rem; outline: none; }
  #join-screen input:focus { border-color: #0f3460; }
  #join-screen button { margin-top: 1rem; padding: 12px 32px; background: #0f3460; color: #fff; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
  #join-screen button:hover { background: #1a5276; }

  /* Chat Screen */
  #chat-screen { display: none; width: 100%; height: 100vh; }
  .chat-container { display: flex; height: 100%; }

  /* Sidebar */
  .sidebar { width: 220px; background: #16213e; border-right: 1px solid #333; display: flex; flex-direction: column; }
  .sidebar-header { padding: 16px; border-bottom: 1px solid #333; }
  .sidebar-header h2 { font-size: 1.1rem; color: #fff; }
  .sidebar-header .room-name { font-size: 0.85rem; color: #888; margin-top: 4px; }
  .user-list { flex: 1; overflow-y: auto; padding: 12px; }
  .user-item { padding: 8px 12px; margin: 2px 0; border-radius: 6px; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
  .user-item::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #2ecc71; flex-shrink: 0; }

  /* Main chat */
  .chat-main { flex: 1; display: flex; flex-direction: column; }
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 4px; }
  .message { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
  .message.own { align-self: flex-end; background: #0f3460; color: #fff; }
  .message.other { align-self: flex-start; background: #16213e; }
  .message .meta { font-size: 0.75rem; color: #888; margin-bottom: 2px; }
  .message.system { align-self: center; background: transparent; color: #666; font-size: 0.8rem; font-style: italic; padding: 4px 0; }

  /* Input */
  .chat-input { display: flex; padding: 12px 16px; border-top: 1px solid #333; background: #16213e; gap: 8px; }
  .chat-input input { flex: 1; padding: 12px 16px; border: 1px solid #333; border-radius: 8px; background: #1a1a2e; color: #e0e0e0; font-size: 1rem; outline: none; }
  .chat-input input:focus { border-color: #0f3460; }
  .chat-input button { padding: 12px 24px; background: #0f3460; color: #fff; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
  .chat-input button:hover { background: #1a5276; }

  @media (max-width: 600px) {
    .sidebar { width: 140px; }
    .message { max-width: 85%; }
  }
</style>
</head>
<body>

<div id="join-screen">
  <h1>Chat Room</h1>
  <input type="text" id="username-input" placeholder="Username" maxlength="20" autofocus>
  <input type="text" id="room-input" placeholder="Room name" maxlength="30" value="general">
  <button onclick="joinRoom()">Join</button>
</div>

<div id="chat-screen">
  <div class="chat-container">
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Online</h2>
        <div class="room-name" id="room-label"></div>
      </div>
      <div class="user-list" id="user-list"></div>
    </div>
    <div class="chat-main">
      <div class="messages" id="messages"></div>
      <div class="chat-input">
        <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
let ws;
let username;
let room;

function joinRoom() {
  username = document.getElementById('username-input').value.trim();
  room = document.getElementById('room-input').value.trim();
  if (!username || !room) return;

  document.getElementById('join-screen').style.display = 'none';
  document.getElementById('chat-screen').style.display = 'block';
  document.getElementById('room-label').textContent = '#' + room;

  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws?room=${encodeURIComponent(room)}&username=${encodeURIComponent(username)}`);

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    switch (data.type) {
      case 'message':
      case 'join':
      case 'leave':
        appendMessage(data);
        break;
      case 'history':
        if (data.messages) {
          data.messages.forEach(msg => appendMessage(msg));
        }
        break;
      case 'presence':
        updatePresence(data.users || []);
        break;
    }
  };

  ws.onclose = () => {
    appendMessage({ type: 'system', content: 'Disconnected from server.' });
  };

  document.getElementById('msg-input').focus();
}

function appendMessage(msg) {
  const el = document.createElement('div');
  el.classList.add('message');

  if (msg.type === 'join' || msg.type === 'leave') {
    el.classList.add('system');
    el.textContent = msg.content;
  } else if (msg.type === 'system') {
    el.classList.add('system');
    el.textContent = msg.content;
  } else {
    el.classList.add(msg.username === username ? 'own' : 'other');
    const meta = document.createElement('div');
    meta.classList.add('meta');
    const time = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString() : '';
    meta.textContent = msg.username === username ? time : `${msg.username}  ${time}`;
    el.appendChild(meta);
    const text = document.createElement('div');
    text.textContent = msg.content;
    el.appendChild(text);
  }

  const container = document.getElementById('messages');
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
}

function updatePresence(users) {
  const list = document.getElementById('user-list');
  list.innerHTML = '';
  users.forEach(u => {
    const item = document.createElement('div');
    item.classList.add('user-item');
    item.textContent = u + (u === username ? ' (you)' : '');
    list.appendChild(item);
  });
}

function sendMessage() {
  const input = document.getElementById('msg-input');
  const content = input.value.trim();
  if (!content || !ws) return;

  ws.send(JSON.stringify({ type: 'message', content }));
  input.value = '';
  input.focus();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    if (document.getElementById('chat-screen').style.display === 'block') {
      sendMessage();
    } else {
      joinRoom();
    }
  }
});
</script>
</body>
</html>
